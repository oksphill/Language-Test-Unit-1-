<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UI and Interaction Test Suite</title>
</head>
<body>
  <div id="test-summary">Testing...</div>
  <ul id="ui-test-results"></ul>

  <!-- Hidden fixture with elements expected by UI -->
  <div id="fixture" style="display: none;">
    <canvas id="confetti-canvas"></canvas>
    <div id="app-logo-badge">1</div>
    <h1 id="app-header-title">Language Test • Unit 1</h1>
    <div id="app-header-subtitle">Clothes and Appearance</div>
    <button id="btn-header-change-unit"></button>
    <div id="header-student-tag"><span id="header-student-name"></span></div>
    <div id="save-indicator"></div>
    <button id="btn-teacher-settings"></button>
    <div id="active-variant-badge"></div>
    <div id="floating-help-btn"></div>
    <div id="btn-submit-test"></div>
    <div id="btn-prev-section"></div>
    <div id="btn-next-section"></div>
    <div id="badge-count-vocabulary"></div>
    <div id="badge-count-grammar"></div>
    <div id="badge-count-listening"></div>
    <div id="badge-count-reading"></div>
    <div id="badge-count-communication"></div>
    <div id="test-progress-fill"></div>
    <div id="test-progress-counter"></div>
    <div class="section-tabs"></div>

    <div class="screen" id="screen-start">
      <div id="resume-session-prompt"></div>
      <p id="start-hero-subtitle"></p>
      <form id="start-test-form">
        <div id="course-selector-container">
          <span id="selected-course-badge"></span>
          <input type="radio" name="test-course" id="course-radio-gogetter1" value="gogetter1">
          <input type="radio" name="test-course" id="course-radio-gogetter2" value="gogetter2">
          <input type="radio" name="test-course" id="course-radio-gogetter3" value="gogetter3" checked>
          <input type="radio" name="test-course" id="course-radio-gogetter4" value="gogetter4">
        </div>
        <input type="text" id="student-name" value="Test Student" placeholder="e.g. Sarah Jenkins">
        <div id="teacher-step-card">
          <input type="text" id="teacher-name">
          <span id="teacher-valid-indicator"></span>
        </div>
        <span id="selected-unit-badge"></span>
        <div id="unit-selector-grid">
          <input type="radio" name="test-unit" id="unit-radio-unit1" value="unit1" checked>
          <input type="radio" name="test-unit" id="unit-radio-unit2" value="unit2">
          <input type="radio" name="test-unit" id="unit-radio-unit3" value="unit3">
          <input type="radio" name="test-unit" id="unit-radio-unit4" value="unit4">
          <input type="radio" name="test-unit" id="unit-radio-mid_year" value="mid_year">
          <input type="radio" name="test-unit" id="unit-radio-unit5" value="unit5">
          <input type="radio" name="test-unit" id="unit-radio-unit6" value="unit6">
          <input type="radio" name="test-unit" id="unit-radio-unit7" value="unit7">
          <input type="radio" name="test-unit" id="unit-radio-unit8" value="unit8">
          <input type="radio" name="test-unit" id="unit-radio-end_of_year" value="end_of_year">
        </div>
        <span id="preview-unit-name"></span>
        <span id="preview-unit-topics"></span>
        <span id="variant-a-desc"></span>
        <span id="variant-b-desc"></span>
        <input type="radio" name="test-variant" value="variantA" checked>
        <input type="radio" name="test-variant" value="variantB">
      </form>
    </div>

    <div class="screen" id="screen-test">
      <div class="test-section-panel" id="section-panel-vocabulary"></div>
      <div class="test-section-panel" id="section-panel-grammar"></div>
      <div class="test-section-panel" id="section-panel-listening"></div>
      <div class="test-section-panel" id="section-panel-reading"></div>
      <div class="test-section-panel" id="section-panel-communication"></div>
    </div>

    <div class="screen" id="screen-review">
      <div id="review-content-container"></div>
    </div>

    <div id="modal-submit-confirmation">
      <div id="submit-confirm-count"></div>
      <div id="submit-confirm-warning"></div>
      <button id="btn-jump-unanswered"></button>
      <button id="btn-confirm-final-submit"></button>
    </div>

    <div id="modal-ask-teacher">
      <input id="ask-teacher-student-name">
      <input id="ask-teacher-task-info">
      <textarea id="ask-teacher-question-text"></textarea>
      <div id="ask-teacher-status"></div>
      <button id="btn-send-question"></button>
    </div>

    <div id="modal-teacher-settings">
      <input id="settings-sheets-url">
      <input id="settings-telegram-token">
      <input id="settings-telegram-chatid">
      <div id="settings-test-results"></div>
      <tbody id="archive-table-body"></tbody>
      <button id="btn-test-sheets"></button>
      <button id="btn-test-telegram"></button>
      <button id="btn-save-teacher-settings"></button>
      <button id="btn-clear-archive"></button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data/unit1.js"></script>
  <script src="js/data/unit2.js"></script>
  <script src="js/data/unit3.js"></script>
  <script src="js/data/unit4.js"></script>
  <script src="js/data/mid_year.js"></script>
  <script src="js/data/unit5.js"></script>
  <script src="js/data/unit6.js"></script>
  <script src="js/data/unit7.js"></script>
  <script src="js/data/unit8.js"></script>
  <script src="js/data/end_of_year.js"></script>

  <!-- Load Go Getter 1 Modules -->
  <script src="js/data/gg1/gg1_placeholder.js"></script>

  <!-- Load Go Getter 2 Modules -->
  <script src="js/data/gg2_unit1.js"></script>
  <script src="js/data/gg2_unit2.js"></script>
  <script src="js/data/gg2_unit3.js"></script>
  <script src="js/data/gg2_unit4.js"></script>
  <script src="js/data/gg2_mid_year.js"></script>
  <script src="js/data/gg2_unit5.js"></script>
  <script src="js/data/gg2_unit6.js"></script>
  <script src="js/data/gg2_unit7.js"></script>
  <script src="js/data/gg2_unit8.js"></script>
  <script src="js/data/gg2_end_of_year.js"></script>

  <!-- Load Go Getter 3 Modules -->
  <script src="js/data/gg3_unit1.js"></script>
  <script src="js/data/gg3_unit2.js"></script>
  <script src="js/data/gg3_unit3.js"></script>
  <script src="js/data/gg3_unit4.js"></script>
  <script src="js/data/gg3_mid_year.js"></script>
  <script src="js/data/gg3_unit5.js"></script>
  <script src="js/data/gg3_unit6.js"></script>
  <script src="js/data/gg3_unit7.js"></script>
  <script src="js/data/gg3_unit8.js"></script>
  <script src="js/data/gg3_end_of_year.js"></script>

  <script src="js/test-data.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/config.js"></script>
  <script src="js/teacher-service.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const results = [];
    function assert(name, condition, details = "") {
      if (condition) {
        results.push({ name, pass: true });
      } else {
        results.push({ name, pass: false, details });
        console.error("FAIL:", name, details);
      }
    }

    try {
      // 1. UI Initialization
      UI.init();
      assert("UI.init executes cleanly", UI.activeScreen === "start");
      UI.onSelectCourse("gogetter4");
      assert("Course selected as gogetter4 for GG4 test suites", UI.currentCourse === "gogetter4");

      // 2. Test selecting each unit from 1 to 8
      for (let u = 1; u <= 8; u++) {
        const uKey = "unit" + u;
        UI.onSelectUnit(uKey);
        assert(`onSelectUnit(${uKey}) updates currentUnit`, UI.currentUnit === uKey);
        const preview = document.getElementById("preview-unit-name").textContent;
        assert(`onSelectUnit(${uKey}) updates preview banner`, preview.includes(`Unit ${u}`));
      }

      // 3. Test starting a test for Unit 2 Variant A
      UI.currentUnit = "unit2";
      UI.currentVariant = "variantA";
      UI.student = { fullName: "Alice Brown", firstName: "Alice", lastName: "Brown", studentClass: "5B", variant: "variantA", unit: "unit2" };
      UI.renderTestUI();
      UI.switchScreen("test");

      assert("Screen switched to test", UI.activeScreen === "test");
      assert("Header logo shows Unit 2", document.getElementById("app-logo-badge").textContent === "2");
      assert("Header title shows Unit 2", document.getElementById("app-header-title").textContent.includes("Unit 2"));

      // Check Section 1 (Vocabulary) rendered
      const secVocab = document.getElementById("section-panel-vocabulary");
      assert("Unit 2 Vocab panel has task cards", secVocab.querySelectorAll(".task-card").length === 3);

      // Check Task 1 (Word Bank) chips rendered
      const chips = secVocab.querySelectorAll(".word-chip");
      assert("Unit 2 Task 1 has word chips", chips.length >= 8);

      // Check Section 2 (Grammar) rendered
      const secGrammar = document.getElementById("section-panel-grammar");
      assert("Unit 2 Grammar panel has 2 tasks", secGrammar.querySelectorAll(".task-card").length === 2);

      // Check Circle-Choice Task (Task 5)
      const pills = secGrammar.querySelectorAll(".choice-pill-btn");
      assert("Unit 2 Task 5 has choice pills", pills.length >= 12);

      // Test clicking a choice pill
      const mustPill = secGrammar.querySelector('.choice-pill-btn[data-qid="A_5_1"][data-value="must"]');
      assert("Choice pill 'must' exists", !!mustPill);
      mustPill.click();
      const hiddenInput = document.getElementById("input-A_5_1");
      assert("Clicking choice pill sets input value", hiddenInput && hiddenInput.value === "must");
      assert("Clicking choice pill marks it as selected", mustPill.classList.contains("selected"));
      assert("Answers object contains question", UI.answers["A_5_1"] === "must");

      // Test inserting word from Word Bank into gap
      const dentistChip = secVocab.querySelector('.word-chip[data-word="dentist"]');
      assert("Word chip 'dentist' exists", !!dentistChip);
      dentistChip.click();
      const firstGap = document.getElementById("input-A_1_1");
      assert("Clicking word chip fills first empty gap", firstGap && firstGap.value === "dentist");
      assert("Answers object updated with dentist", UI.answers["A_1_1"] === "dentist");

      // 4. Test Unit 7 Sentence Order Interactive Tasks (Interactive word chips + zero placeholders)
      UI.currentUnit = "unit7";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();

      const sec7Grammar = document.getElementById("section-panel-grammar");
      const orderInputs = sec7Grammar.querySelectorAll(".sentence-order-input");
      assert("Unit 7 Task 4 has sentence order inputs", orderInputs.length >= 5);
      const interactiveItems = sec7Grammar.querySelectorAll(".interactive-order-item");
      assert("Unit 7 Task 4 renders interactive order items", interactiveItems.length >= 5);
      assert("Sentence order inputs have no placeholder text", !orderInputs[0].placeholder);

      // Verify no test-gap inputs in current section have placeholders
      const allSec7Gaps = sec7Grammar.querySelectorAll(".test-gap");
      const gapsWithPlaceholder = Array.from(allSec7Gaps).filter(g => g.placeholder && g.placeholder.length > 0);
      assert("Zero gap inputs have placeholder text in Grammar section", gapsWithPlaceholder.length === 0);

      // Simulate typing answer directly into input
      const firstOrderInp = orderInputs[0];
      const qid = firstOrderInp.getAttribute("data-qid");
      firstOrderInp.value = "The book was written in 1990.";
      firstOrderInp.dispatchEvent(new Event("input", { bubbles: true }));
      assert("Typing in sentence input updates answers object", UI.answers[qid] === "The book was written in 1990.");

      // 5. Test Evaluation and Results rendering
      const sampleAnswers = {};
      const u7TestData = TEST_DATA.getTest("unit7", "variantA");
      // Populate correct answers
      for (const sec of Object.values(u7TestData.sections)) {
        for (const task of sec.tasks) {
          for (const [qKey, ansObj] of Object.entries(task.answers)) {
            sampleAnswers[qKey] = ansObj.expected[0];
          }
        }
      }
      const evalRes = Validator.evaluateTest("variantA", sampleAnswers, "unit7");
      assert("Unit 7 evaluation totalScore is 35/35", evalRes.totalScore === 35);
      assert("Unit 7 zero mistakes", evalRes.mistakes.length === 0);

      UI.renderResultsScreen(evalRes);
      const reviewContainer = document.getElementById("review-content-container");
      assert("Review container rendered hero card", !!reviewContainer.querySelector(".results-hero-card"));
      assert("Review container rendered 35 review items", reviewContainer.querySelectorAll(".review-card").length === 35);

      // 6. Test Unit 1 Illustrations (Mrs Cook & Gregory Cook)
      UI.currentUnit = "unit1";
      UI.currentVariant = "variantA";
      UI.renderTestUI();
      const u1Vocab = document.getElementById("section-panel-vocabulary");
      const mrsCookImg = u1Vocab.querySelector("#card-task_1 .test-illustration-img");
      assert("Unit 1 Task 1 renders Mrs Cook image", mrsCookImg && mrsCookImg.getAttribute("src").includes("mrs_cook"));
      const gregoryImg = u1Vocab.querySelector("#card-task_2 .test-illustration-img");
      assert("Unit 1 Task 2 renders Gregory Cook image", gregoryImg && gregoryImg.getAttribute("src").includes("gregory_cook"));

      // 7. Test Disappearing Word Bank Chips
      UI.answers = {};
      UI.renderTestUI();
      const task1Card = document.getElementById("card-task_1");
      const braceletsChip = task1Card.querySelector('.word-chip[data-word="bracelets"]');
      const ringsChip = task1Card.querySelector('.word-chip[data-word="rings"]');

      assert("Before matching, bracelets chip is visible", !braceletsChip.classList.contains("is-used"));
      assert("Before matching, rings chip is visible", !ringsChip.classList.contains("is-used"));

      // Click bracelets chip to fill first gap
      braceletsChip.click();
      assert("After clicking, bracelets chip disappears (has is-used)", braceletsChip.classList.contains("is-used"));
      assert("Gap 1 filled with bracelets", document.getElementById("input-A_1_1").value === "bracelets");

      // Click rings chip to fill second gap
      ringsChip.click();
      assert("After clicking, rings chip disappears (has is-used)", ringsChip.classList.contains("is-used"));
      assert("Gap 2 filled with rings", document.getElementById("input-A_1_2").value === "rings");

      // Clear gap 1
      const gap1 = document.getElementById("input-A_1_1");
      gap1.value = "";
      gap1.dispatchEvent(new Event("input", { bubbles: true }));
      assert("After clearing gap 1, bracelets chip reappears (!is-used)", !braceletsChip.classList.contains("is-used"));
      assert("rings chip is still hidden", ringsChip.classList.contains("is-used"));

      // 8. Test Dynamic Subtitle and International Student Placeholder
      const nameInput = document.getElementById("student-name");
      assert("Student name input has international placeholder", nameInput && nameInput.placeholder === "e.g. Sarah Jenkins");

      UI.onSelectUnit("unit1");
      const subUnit1 = document.getElementById("start-hero-subtitle").textContent;
      assert("Unit 1 subtitle mentions clothes/appearance or 6 tasks", subUnit1.includes("clothes") || subUnit1.includes("6 tasks") || subUnit1.length > 0);

      UI.onSelectUnit("mid_year");
      const subMid = document.getElementById("start-hero-subtitle").textContent;
      assert("Mid-Year subtitle reflects Units 1-4 and listening", subMid.includes("Units 1–4") && subMid.includes("listening"));
      assert("Mid-Year badge updated", document.getElementById("selected-unit-badge").textContent.includes("Mid-Year"));

      UI.onSelectUnit("end_of_year");
      const subEnd = document.getElementById("start-hero-subtitle").textContent;
      assert("End-of-Year subtitle reflects Units 1-8 and listening", subEnd.includes("Units 1–8") && subEnd.includes("listening"));
      assert("End-of-Year badge updated", document.getElementById("selected-unit-badge").textContent.includes("End-of-Year"));

      // 9. Test Mid-Year Test UI Rendering and Audio Player
      UI.currentUnit = "mid_year";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();

      const tabsBar = document.querySelector(".section-tabs");
      const tabBtns = tabsBar ? tabsBar.querySelectorAll(".section-tab-btn") : [];
      assert("Mid-Year renders 5 section tabs", tabBtns.length === 5);

      const midListeningPanel = document.getElementById("section-panel-listening");
      const midAudioPlayer = midListeningPanel ? midListeningPanel.querySelector(".audio-player-card") : null;
      assert("Mid-Year Listening panel has audio player card", !!midAudioPlayer);

      const midAudioEl = midAudioPlayer ? midAudioPlayer.querySelector("audio") : null;
      assert("Mid-Year audio element source is track_10_mid_year.mp3", midAudioEl && midAudioEl.getAttribute("src").includes("track_10_mid_year.mp3"));

      const playBtn = midAudioPlayer ? midAudioPlayer.querySelector(".btn-audio-play") : null;
      assert("Audio player has play button", !!playBtn);

      const speedBtn = midAudioPlayer ? midAudioPlayer.querySelector(".btn-audio-speed") : null;
      assert("Audio player has speed button", !!speedBtn && speedBtn.textContent.includes("1.0x"));
      if (speedBtn) {
        speedBtn.click();
        assert("Clicking speed button cycles to 0.85x", speedBtn.textContent.includes("0.85x"));
        speedBtn.click();
        assert("Clicking speed button cycles to 1.2x", speedBtn.textContent.includes("1.2x"));
        speedBtn.click();
        assert("Clicking speed button cycles back to 1.0x", speedBtn.textContent.includes("1.0x"));
      }

      const midReadingPanel = document.getElementById("section-panel-reading");
      const readingPassage = midReadingPanel ? midReadingPanel.querySelector(".reading-passage-box") : null;
      assert("Mid-Year Reading panel renders reading passage", !!readingPassage);

      const midCommPanel = document.getElementById("section-panel-communication");
      const dialogueGaps = midCommPanel ? midCommPanel.querySelectorAll(".dialogue-gap-input, .test-gap") : [];
      assert("Mid-Year Communication panel renders dialogue gaps", dialogueGaps.length >= 8);

      // Verify Mid-Year Grammar Tasks 4 and 6 have choice pills
      const midGrammarPanel = document.getElementById("section-panel-grammar");
      const midTask4Pills = midGrammarPanel ? midGrammarPanel.querySelectorAll('#card-task_4 .choice-pill-btn') : [];
      assert("Mid-Year Task 4 (Past Simple/Continuous) renders choice pills", midTask4Pills.length >= 10);
      const wasHavingPill = midGrammarPanel ? midGrammarPanel.querySelector('.choice-pill-btn[data-qid="MY_A_4_1"][data-value="was having"]') : null;
      assert("Pill 'was having' exists", !!wasHavingPill);
      if (wasHavingPill) {
        wasHavingPill.click();
        assert("Clicking 'was having' sets input value", document.getElementById("input-MY_A_4_1").value === "was having");
        assert("Answers object updated with was having", UI.answers["MY_A_4_1"] === "was having");
      }

      const midTask6Pills = midGrammarPanel ? midGrammarPanel.querySelectorAll('#card-task_6 .choice-pill-btn') : [];
      assert("Mid-Year Task 6 (Present Perfect/Past Simple) renders choice pills", midTask6Pills.length >= 10);
      const arrivedPill = midGrammarPanel ? midGrammarPanel.querySelector('.choice-pill-btn[data-qid="MY_A_6_1"][data-value="arrived"]') : null;
      assert("Pill 'arrived' exists", !!arrivedPill);
      if (arrivedPill) {
        arrivedPill.click();
        assert("Clicking 'arrived' sets input value", document.getElementById("input-MY_A_6_1").value === "arrived");
        assert("Answers object updated with arrived", UI.answers["MY_A_6_1"] === "arrived");
      }

      // 10. Test End-of-Year Test UI Rendering and Audio Player
      UI.currentUnit = "end_of_year";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();

      const endListeningPanel = document.getElementById("section-panel-listening");
      const endAudioEl = endListeningPanel ? endListeningPanel.querySelector("audio") : null;
      assert("End-of-Year audio element source is track_11_end_of_year.mp3", endAudioEl && endAudioEl.getAttribute("src").includes("track_11_end_of_year.mp3"));

      const endCommPanel = document.getElementById("section-panel-communication");
      const endMatchingSelects = endCommPanel ? endCommPanel.querySelectorAll(".matching-select") : [];
      assert("End-of-Year Communication renders matching selects", endMatchingSelects.length >= 4);

      // Verify End-of-Year Grammar Task 6 has choice pills
      const endGrammarPanel = document.getElementById("section-panel-grammar");
      const endTask6Pills = endGrammarPanel ? endGrammarPanel.querySelectorAll('#card-task_6 .choice-pill-btn') : [];
      assert("End-of-Year Task 6 (Passive forms) renders choice pills", endTask6Pills.length >= 15);
      const wasPaintedPill = endGrammarPanel ? endGrammarPanel.querySelector('.choice-pill-btn[data-qid="EY_A_6_1"][data-value="was painted"]') : null;
      assert("Pill 'was painted' exists", !!wasPaintedPill);
      if (wasPaintedPill) {
        wasPaintedPill.click();
        assert("Clicking 'was painted' sets input value", document.getElementById("input-EY_A_6_1").value === "was painted");
        assert("Answers object updated with was painted", UI.answers["EY_A_6_1"] === "was painted");
      }

      // 11. Test TeacherService and APP_CONFIG Webhook Integration
      assert("APP_CONFIG object exists", typeof APP_CONFIG === "object");
      assert("TeacherService has getWebhookUrl function", typeof TeacherService.getWebhookUrl === "function");
      APP_CONFIG.sheetsWebhookUrl = "https://script.google.com/macros/s/TEST/exec";
      assert("TeacherService.getWebhookUrl returns configured APP_CONFIG url", TeacherService.getWebhookUrl() === "https://script.google.com/macros/s/TEST/exec");
      APP_CONFIG.sheetsWebhookUrl = "";

      // 12. Test Course Switching and Go Getter 3 Data Integration
      UI.onSelectCourse("gogetter3");
      assert("Current course switched to gogetter3", UI.currentCourse === "gogetter3");
      const gg3Units = TEST_DATA.getUnitsList("gogetter3");
      assert("Go Getter 3 has 10 units (8 units + 2 exams)", gg3Units.length === 10);
      assert("Go Getter 3 includes mid_year", gg3Units.some(u => u.id === "mid_year"));
      assert("Go Getter 3 includes end_of_year", gg3Units.some(u => u.id === "end_of_year"));

      // Test Go Getter 3 Mid-Year Test UI Rendering & Audio
      UI.currentUnit = "mid_year";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();
      const gg3MidAudio = document.getElementById("section-panel-listening").querySelector("audio");
      assert("GG3 Mid-Year audio source is gg3_track_10_mid_year.mp3", gg3MidAudio && gg3MidAudio.getAttribute("src").includes("gg3_track_10_mid_year.mp3"));

      // Test Go Getter 3 End-of-Year Test UI Rendering & Audio
      UI.currentUnit = "end_of_year";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();
      const gg3EndAudio = document.getElementById("section-panel-listening").querySelector("audio");
      assert("GG3 End-of-Year audio source is gg3_track_11_end_of_year.mp3", gg3EndAudio && gg3EndAudio.getAttribute("src").includes("gg3_track_11_end_of_year.mp3"));

      // 13. Test Course Switching and Go Getter 2 Data Integration
      UI.onSelectCourse("gogetter2");
      assert("Current course switched to gogetter2", UI.currentCourse === "gogetter2");
      const gg2Units = TEST_DATA.getUnitsList("gogetter2");
      assert("Go Getter 2 has 10 units (8 units + 2 exams)", gg2Units.length === 10);
      assert("Go Getter 2 includes mid_year", gg2Units.some(u => u.id === "mid_year"));
      assert("Go Getter 2 includes end_of_year", gg2Units.some(u => u.id === "end_of_year"));

      // Test Go Getter 2 Mid-Year Test UI Rendering & Audio
      UI.currentUnit = "mid_year";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();
      const gg2MidAudio = document.getElementById("section-panel-listening").querySelector("audio");
      assert("GG2 Mid-Year audio source is gg2_track_10_mid_year.mp3", gg2MidAudio && gg2MidAudio.getAttribute("src").includes("gg2_track_10_mid_year.mp3"));

      // Test Go Getter 2 End-of-Year Test UI Rendering & Audio
      UI.currentUnit = "end_of_year";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();
      const gg2EndAudio = document.getElementById("section-panel-listening").querySelector("audio");
      assert("GG2 End-of-Year audio source is gg2_track_11_end_of_year.mp3", gg2EndAudio && gg2EndAudio.getAttribute("src").includes("gg2_track_11_end_of_year.mp3"));

      // 14. Test Course Switching to Go Getter 1 (Empty State)
      UI.onSelectCourse("gogetter1");
      assert("Current course switched to gogetter1", UI.currentCourse === "gogetter1");
      const gg1Units = TEST_DATA.getUnitsList("gogetter1");
      assert("Go Getter 1 has 0 units currently", gg1Units.length === 0);

      // Switch back to gogetter4
      UI.onSelectCourse("gogetter4");
      assert("Course switches back to gogetter4 cleanly", UI.currentCourse === "gogetter4");

      // 15. Test Interactive Sentence Order Word Builder (Duolingo-style word reordering)
      UI.onSelectCourse("gogetter2");
      UI.currentUnit = "unit1";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();

      const gg2Grammar = document.getElementById("section-panel-grammar");
      const gg2InteractiveItems = gg2Grammar.querySelectorAll(".interactive-order-item");
      assert("GG2 Unit 1 Task 3 renders interactive-order-item elements", gg2InteractiveItems.length === 4);

      const firstItem = gg2InteractiveItems[0];
      const firstQid = firstItem.getAttribute("data-qid"); // A_3_1
      assert("First interactive item has qid A_3_1", firstQid === "A_3_1");

      const dropzone = firstItem.querySelector(".sentence-dropzone");
      const wordBank = firstItem.querySelector(".word-bank-pool");
      const chipsContainer = firstItem.querySelector(".sentence-chips-container");
      const resetBtn = firstItem.querySelector(".btn-order-reset");
      const syncedInput = firstItem.querySelector(".synced-order-input");

      assert("Interactive item has sentence-dropzone", !!dropzone);
      assert("Interactive item has word-bank-pool", !!wordBank);
      assert("Interactive item has sentence-chips-container", !!chipsContainer);
      assert("Interactive item has btn-order-reset", !!resetBtn);
      assert("Interactive item has synced-order-input", !!syncedInput);
      assert("Synced order input has empty placeholder (rule: zero placeholders)", !syncedInput.placeholder);

      const bankChips = Array.from(wordBank.querySelectorAll(".order-word-chip"));
      assert("Word bank has 7 word chips for prompt", bankChips.length === 7);

      // Find individual word chips by data-word
      const getBankChip = (w) => bankChips.find(c => c.getAttribute("data-word").toLowerCase() === w.toLowerCase());
      const chipWe = getBankChip("we");
      const chipAre = getBankChip("are");
      const chipNever = getBankChip("never");
      const chipLate = getBankChip("late");
      const chipFor = getBankChip("for");
      const chipMusic = getBankChip("Music");
      const chipLessons = getBankChip("lessons");

      assert("Found bank chips: we, are, never, late, for, Music, lessons", !!(chipWe && chipAre && chipNever && chipLate && chipFor && chipMusic && chipLessons));

      // Click each chip in correct sequence
      chipWe.click();
      chipAre.click();
      chipNever.click();
      chipLate.click();
      chipFor.click();
      chipMusic.click();
      chipLessons.click();

      assert("All 7 chips moved into sentence container", chipsContainer.querySelectorAll(".chip-in-sentence").length === 7);
      assert("All bank chips marked as chip-used", bankChips.every(c => c.classList.contains("chip-used")));
      assert("Dropzone has-chips class added", dropzone.classList.contains("has-chips"));

      // Check synced input value and UI.answers
      assert("Synced input value is capitalized and formatted correctly", syncedInput.value === "We are never late for Music lessons");
      assert("UI.answers[A_3_1] updated automatically", UI.answers["A_3_1"] === "We are never late for Music lessons");

      // Test Validator checkAnswer on the constructed answer
      const evalCheck = Validator.checkAnswer(syncedInput.value, ["We are never late for Music lessons."]);
      assert("Constructed sentence passes Validator checkAnswer", evalCheck === true);

      // Test micro-controls: shift chip left
      const sentenceChips = chipsContainer.querySelectorAll(".chip-in-sentence");
      const secondSentenceChip = sentenceChips[1]; // "are"
      const moveLeftBtn = secondSentenceChip.querySelector(".chip-move-btn.move-left");
      assert("Sentence chip has move-left button", !!moveLeftBtn);
      moveLeftBtn.click();
      assert("Moving 'are' left reorders input", syncedInput.value === "Are we never late for Music lessons");

      // Shift back to right
      const firstSentenceChipNow = chipsContainer.querySelectorAll(".chip-in-sentence")[0]; // "are"
      const moveRightBtn = firstSentenceChipNow.querySelector(".chip-move-btn.move-right");
      moveRightBtn.click();
      assert("Moving 'are' right restores original order", syncedInput.value === "We are never late for Music lessons");

      // Test clicking a sentence chip returns it to the bank
      const lastSentenceChip = chipsContainer.querySelector('.chip-in-sentence[data-chip-id="' + chipLessons.getAttribute("data-chip-id") + '"]');
      assert("Last sentence chip exists", !!lastSentenceChip);
      lastSentenceChip.click();
      assert("Clicking sentence chip removes it from sentence", chipsContainer.querySelectorAll(".chip-in-sentence").length === 6);
      assert("Chip 'lessons' is available in bank again (not chip-used)", !chipLessons.classList.contains("chip-used"));
      assert("Input updated after removing chip", syncedInput.value === "We are never late for Music");

      // Put 'lessons' back
      chipLessons.click();
      assert("Chip 'lessons' appended back to sentence", syncedInput.value === "We are never late for Music lessons");

      // Test Reset button
      resetBtn.click();
      assert("Clicking reset button empties sentence chips container", chipsContainer.querySelectorAll(".chip-in-sentence").length === 0);
      assert("Clicking reset button restores all bank chips to available", bankChips.every(c => !c.classList.contains("chip-used")));
      assert("Clicking reset button clears synced input value", syncedInput.value === "");
      assert("Clicking reset button clears UI.answers", UI.answers["A_3_1"] === "");

      // Test sentence order task in GG4 Unit 7 Task 4
      UI.onSelectCourse("gogetter4");
      UI.currentUnit = "unit7";
      UI.currentVariant = "variantA";
      UI.answers = {};
      UI.renderTestUI();

      const u7Grammar = document.getElementById("section-panel-grammar");
      const u7Interactive = u7Grammar.querySelectorAll(".interactive-order-item");
      assert("GG4 Unit 7 Task 4 also renders interactive-order-item elements", u7Interactive.length === 6);
      const u7FirstInput = u7Interactive[0].querySelector(".synced-order-input");
      assert("GG4 Unit 7 Task 4 inputs have empty placeholder", !u7FirstInput.placeholder);

      // ======================================================================
      // 16. OPTIONAL TEACHER FIELD & REPORTING
      // ======================================================================
      const teacherInput = document.getElementById("teacher-name");
      const teacherCard = document.getElementById("teacher-step-card");
      const teacherIndicator = document.getElementById("teacher-valid-indicator");

      assert("Teacher name input exists in DOM", !!teacherInput);
      assert("Teacher name input has no placeholder", !teacherInput.placeholder);
      assert("Teacher card element exists in DOM", !!teacherCard);

      // Test 1: Empty teacher is allowed and optional (does not block start)
      teacherInput.value = "";
      document.getElementById("student-name").value = "Alice Cooper";
      UI.handleStartTest();
      assert("Starting test with empty teacher succeeds", UI.activeScreen === "test");
      assert("Student object has empty teacher string", UI.student.teacher === "");

      // Test 2: Filled teacher is saved in UI.student
      UI.switchScreen("start");
      teacherInput.value = "Mrs. Smith";
      teacherInput.dispatchEvent(new Event("input"));
      assert("Teacher input reflects in teacher-filled class", teacherCard.classList.contains("teacher-filled"));
      assert("Teacher input reflects in valid indicator active", teacherIndicator.classList.contains("active"));

      UI.handleStartTest();
      assert("Starting test with teacher succeeds", UI.activeScreen === "test");
      assert("Student object contains teacher name", UI.student.teacher === "Mrs. Smith");

      // Test 3: Session persistence
      UI.saveCurrentSession();
      const savedSession = Storage.getSession();
      assert("Saved session contains teacher", savedSession.student.teacher === "Mrs. Smith");

      // Test 4: Session resume restores teacher input
      teacherInput.value = "";
      teacherCard.classList.remove("teacher-filled");
      UI.resumeSession(savedSession);
      assert("Resuming session restores teacher input value", teacherInput.value === "Mrs. Smith");
      assert("Resuming session restores teacher-filled class", teacherCard.classList.contains("teacher-filled"));

      // Test 5: TeacherService.submitTestResults payload includes teacher
      let capturedPayload = null;
      const originalArchive = Storage.archiveSubmission;
      Storage.archiveSubmission = function(rec) {
        capturedPayload = rec.payload;
        return originalArchive.call(Storage, rec);
      };
      const mockEvaluation = {
        variantTitle: "Unit 1 Test A",
        totalScore: 35,
        totalMax: 35,
        percentage: 100,
        gradeTier: { badge: "A*" },
        sections: {},
        mistakes: []
      };
      TeacherService.submitTestResults(UI.student, mockEvaluation);
      Storage.archiveSubmission = originalArchive;
      assert("TeacherService payload includes teacher property", !!capturedPayload && capturedPayload.teacher === "Mrs. Smith");

      // Test 6: TeacherService payload defaults to '—' when teacher is empty
      UI.student.teacher = "";
      TeacherService.submitTestResults(UI.student, mockEvaluation);
      assert("TeacherService payload defaults to '—' when teacher is empty", Storage.getSubmissionsArchive()[0].payload.teacher === "—");

    } catch (e) {
      assert("Unhandled Exception in UI Test Suite", false, e.toString() + "\n" + e.stack);
    }

    const passCount = results.filter(r => r.pass).length;
    const failCount = results.filter(r => !r.pass).length;
    const summary = `UI_RESULTS: ${passCount} PASSED, ${failCount} FAILED`;

    const summaryEl = document.getElementById("test-summary");
    summaryEl.innerText = summary;

    document.getElementById("ui-test-results").innerHTML = results.map(r => `
      <li style="color:${r.pass ? 'green' : 'red'}">${r.pass ? '✓' : '✗'} ${r.name} ${r.details || ''}</li>
    `).join("");
  </script>
</body>
</html>
