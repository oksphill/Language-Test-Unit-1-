<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automated Test Suite - Language Tests Units 1-8</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
    h1 { margin-bottom: 8px; }
    #summary { font-size: 1.25rem; font-weight: bold; margin: 16px 0; padding: 12px 16px; border-radius: 8px; }
    .pass-sum { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .fail-sum { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    ul { list-style: none; padding: 0; }
    li { padding: 6px 10px; margin-bottom: 4px; border-radius: 4px; font-family: monospace; }
    li.pass { background: #f0fdf4; color: #15803d; }
    li.fail { background: #fef2f2; color: #b91c1c; font-weight: bold; }
  </style>
</head>
<body>
  <h1>English Language Tests (Units 1–8) — Test Suite</h1>
  <div id="summary">Running tests...</div>
  <ul id="test-results"></ul>

  <!-- Load All Unit Data Modules -->
  <script src="js/data/unit1.js"></script>
  <script src="js/data/unit2.js"></script>
  <script src="js/data/unit3.js"></script>
  <script src="js/data/unit4.js"></script>
  <script src="js/data/mid_year.js"></script>
  <script src="js/data/unit5.js"></script>
  <script src="js/data/unit6.js"></script>
  <script src="js/data/unit7.js"></script>
  <script src="js/data/unit8.js"></script>
  <script src="js/data/end_of_year.js"></script>
  <script src="js/test-data.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/teacher-service.js"></script>

  <script>
    const results = [];
    function assert(name, condition, details = "") {
      if (condition) {
        results.push({ name, pass: true });
        console.log("PASS:", name);
      } else {
        results.push({ name, pass: false, details });
        console.error("FAIL:", name, details);
      }
    }

    try {
      // 1. Data Aggregator Tests
      assert("TEST_DATA exists", typeof TEST_DATA === "object");
      const unitList = TEST_DATA.getUnitsList();
      assert("Units list contains 10 units", unitList.length === 10);

      // 2. Comprehensive Test Across All 8 Units (16 Variants)
      for (let u = 1; u <= 8; u++) {
        const uKey = "unit" + u;
        const unitData = TEST_DATA[uKey];
        assert(`[${uKey}] defined`, !!unitData);
        assert(`[${uKey}] has title`, typeof unitData.title === "string" && unitData.title.length > 0);
        assert(`[${uKey}] has variantA`, !!unitData.variantA);
        assert(`[${uKey}] has variantB`, !!unitData.variantB);
        assert(`[${uKey}] Variant A total points is 35`, unitData.variantA.totalPoints === 35);
        assert(`[${uKey}] Variant B total points is 35`, unitData.variantB.totalPoints === 35);

        // Test Perfect Score Evaluation for Variant A
        const perfectA = {};
        for (const sec of Object.values(unitData.variantA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }
          }
        }
        const evalA = Validator.evaluateTest("variantA", perfectA, uKey);
        assert(`[${uKey} Variant A] Total Score is 35/35`, evalA.totalScore === 35, `Got: ${evalA.totalScore}`);
        assert(`[${uKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[${uKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Test Perfect Score Evaluation for Variant B
        const perfectB = {};
        for (const sec of Object.values(unitData.variantB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectB[qId] = ansObj.expected[0];
            }
          }
        }
        const evalB = Validator.evaluateTest("variantB", perfectB, uKey);
        assert(`[${uKey} Variant B] Total Score is 35/35`, evalB.totalScore === 35, `Got: ${evalB.totalScore}`);
        assert(`[${uKey} Variant B] Percentage is 100%`, evalB.percentage === 100);
        assert(`[${uKey} Variant B] Zero mistakes`, evalB.mistakes.length === 0, `Mistakes: ${evalB.mistakes.map(m=>m.id).join(',')}`);
      }

      // 2b. Mid-Year and End-of-Year Tests (50 points each, 5 sections)
      for (const examKey of ["mid_year", "end_of_year"]) {
        const examData = TEST_DATA[examKey];
        assert(`[${examKey}] defined`, !!examData);
        assert(`[${examKey}] has title`, typeof examData.title === "string" && examData.title.length > 0);
        assert(`[${examKey}] has variantA`, !!examData.variantA);
        assert(`[${examKey}] has variantB`, !!examData.variantB);
        assert(`[${examKey}] Variant A total points is 50`, examData.variantA.totalPoints === 50);
        assert(`[${examKey}] Variant B total points is 50`, examData.variantB.totalPoints === 50);

        // Check 5 sections exist
        const aSecs = Object.keys(examData.variantA.sections);
        assert(`[${examKey} Variant A] has 5 sections`, aSecs.length === 5 && aSecs.includes("listening") && aSecs.includes("reading"));
        const bSecs = Object.keys(examData.variantB.sections);
        assert(`[${examKey} Variant B] has 5 sections`, bSecs.length === 5 && bSecs.includes("listening") && bSecs.includes("reading"));

        // Perfect score eval Variant A
        const perfectA = {};
        for (const sec of Object.values(examData.variantA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }
          }
        }
        const evalA = Validator.evaluateTest("variantA", perfectA, examKey);
        assert(`[${examKey} Variant A] Total Score is 50/50`, evalA.totalScore === 50, `Got: ${evalA.totalScore}`);
        assert(`[${examKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[${examKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Perfect score eval Variant B
        const perfectB = {};
        for (const sec of Object.values(examData.variantB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectB[qId] = ansObj.expected[0];
            }
          }
        }
        const evalB = Validator.evaluateTest("variantB", perfectB, examKey);
        assert(`[${examKey} Variant B] Total Score is 50/50`, evalB.totalScore === 50, `Got: ${evalB.totalScore}`);
        assert(`[${examKey} Variant B] Percentage is 100%`, evalB.percentage === 100);
        assert(`[${examKey} Variant B] Zero mistakes`, evalB.mistakes.length === 0, `Mistakes: ${evalB.mistakes.map(m=>m.id).join(',')}`);
      }

      // 3. Normalization & Contraction Equivalence Tests
      assert("Normalizes lowercase", Validator.normalize("  SHIRT  ") === "shirt");
      assert("Normalizes smart apostrophe", Validator.normalize("didn’t") === "didn't");
      assert("Removes trailing dot", Validator.normalize("baggy.") === "baggy");
      assert("Handles didn't as did not", Validator.checkAnswer("didn't", ["did not"]));
      assert("Handles did not as didn't", Validator.checkAnswer("did not", ["didn't"]));
      assert("Handles haven't as have not", Validator.checkAnswer("haven't", ["have not"]));
      assert("Handles won't as will not", Validator.checkAnswer("won't", ["will not"]));
      assert("Handles isn't as is not", Validator.checkAnswer("isn't", ["is not"]));
      assert("Handles 'll as will", Validator.checkAnswer("we'll put", ["we will put"]));

      // 4. Illustrations for Unit 1
      assert("Mrs Cook illustration generated", Illustrations.renderIllustration("mrs_cook").includes("<img"));
      assert("Mrs Smith illustration generated", Illustrations.renderIllustration("mrs_smith").includes("<img"));
      assert("Gregory Cook illustration generated", Illustrations.renderIllustration("gregory_cook").includes("<img"));
      assert("Lee illustration generated", Illustrations.renderIllustration("lee").includes("<img"));

    } catch (e) {
      assert("Unhandled Exception in Test Suite", false, e.toString() + "\n" + e.stack);
    }

    const passCount = results.filter(r => r.pass).length;
    const failCount = results.filter(r => !r.pass).length;
    const summary = `RESULTS: ${passCount} PASSED, ${failCount} FAILED`;
    console.log(summary);

    const summaryEl = document.getElementById("summary");
    summaryEl.className = failCount === 0 ? "pass-sum" : "fail-sum";
    summaryEl.innerText = summary;

    document.getElementById("test-results").innerHTML = results.map(r => `
      <li class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'} ${r.name} ${r.details || ''}</li>
    `).join("");
  </script>
</body>
</html>
