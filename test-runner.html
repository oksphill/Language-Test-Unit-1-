  <script>
    const results = [];
    function assert(name, condition, details = "") {
      if (condition) {
        results.push({ name, pass: true });
        console.log("PASS:", name);
      } else {
        results.push({ name, pass: false, details });
        console.error("FAIL:", name, details);
      }
    }

    try {
      // 1. Data Aggregator Tests
      assert("TEST_DATA exists", typeof TEST_DATA === "object");
      const unitList = TEST_DATA.getUnitsList();
      assert("Units list contains 10 units", unitList.length === 10);

      // 2. Comprehensive Test Across All 8 Units (16 Variants) - Go Getter 4
      for (let u = 1; u <= 8; u++) {
        const uKey = "unit" + u;
        const unitData = TEST_DATA.courses.gogetter4.units[uKey];
        assert(`[GG4 ${uKey}] defined`, !!unitData);
        assert(`[GG4 ${uKey}] has title`, typeof unitData.title === "string" && unitData.title.length > 0);
        assert(`[GG4 ${uKey}] has variantA`, !!unitData.variantA);
        assert(`[GG4 ${uKey}] has variantB`, !!unitData.variantB);
        assert(`[GG4 ${uKey}] Variant A total points is 35`, unitData.variantA.totalPoints === 35);
        assert(`[GG4 ${uKey}] Variant B total points is 35`, unitData.variantB.totalPoints === 35);

        // Test Perfect Score Evaluation for Variant A
        const perfectA = {};
        for (const sec of Object.values(unitData.variantA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }
          }
        }
        const evalA = Validator.evaluateTest("variantA", perfectA, uKey, "gogetter4");
        assert(`[GG4 ${uKey} Variant A] Total Score is 35/35`, evalA.totalScore === 35, `Got: ${evalA.totalScore}`);
        assert(`[GG4 ${uKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[GG4 ${uKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Test Perfect Score Evaluation for Variant B
        const perfectB = {};
        for (const sec of Object.values(unitData.variantB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectB[qId] = ansObj.expected[0];
            }
          }
        }
        const evalB = Validator.evaluateTest("variantB", perfectB, uKey, "gogetter4");
        assert(`[GG4 ${uKey} Variant B] Total Score is 35/35`, evalB.totalScore === 35, `Got: ${evalB.totalScore}`);
        assert(`[GG4 ${uKey} Variant B] Percentage is 100%`, evalB.percentage === 100);
        assert(`[GG4 ${uKey} Variant B] Zero mistakes`, evalB.mistakes.length === 0, `Mistakes: ${evalB.mistakes.map(m=>m.id).join(',')}`);
      }

      // 2b. Mid-Year and End-of-Year Tests (Go Getter 4, 50 points each, 5 sections)

        const examData = TEST_DATA.courses.gogetter4.units[examKey];
        assert(`[GG4 ${examKey}] defined`, !!examData);

        assert(`[GG4 ${examKey}] Variant B total points is 50`, examData.variantB.totalPoints === 50);

        const aSecs = Object.keys(examData.variantA.sections);

      // 2c. Go Getter 3 Tests across all 8 Units (16 Variants, 30-31 points each)

        for (const sec of Object.values(testA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }

        assert(`[GG3 ${uKey} Variant A] Total Score is ${expectedPts}/${expectedPts}`, evalA.totalScore === expectedPts, `Got: ${evalA.totalScore}`);
        assert(`[GG3 ${uKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[GG3 ${uKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        for (const sec of Object.values(testB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectB[qId] = ansObj.expected[0];
            }
          }
        }
        const evalB = Validator.evaluateTest("variantB", perfectB, uKey, "gogetter3");
        assert(`[GG3 ${uKey} Variant B] Total Score is ${expectedPts}/${expectedPts}`, evalB.totalScore === expectedPts, `Got: ${evalB.totalScore}`);
        assert(`[GG3 ${uKey} Variant B] Percentage is 100%`, evalB.percentage === 100);
        assert(`[GG3 ${uKey} Variant B] Zero mistakes`, evalB.mistakes.length === 0, `Mistakes: ${evalB.mistakes.map(m=>m.id).join(',')}`);
      }

      // 2d. Go Getter 3 Mid-Year and End-of-Year Exams (50 points each, 5 sections)
      for (const examKey of ["mid_year", "end_of_year"]) {
        const testA = TEST_DATA.getTest(examKey, "variantA", "gogetter3");
        const testB = TEST_DATA.getTest(examKey, "variantB", "gogetter3");
        assert(`[GG3 ${examKey}] Variant A defined`, !!testA);
        assert(`[GG3 ${examKey}] Variant B defined`, !!testB);
        assert(`[GG3 ${examKey}] Variant A total points is 50`, testA.totalPoints === 50);
        assert(`[GG3 ${examKey}] Variant B total points is 50`, testB.totalPoints === 50);

        // Check 5 sections exist
        const aSecs = Object.keys(testA.sections);
        assert(`[GG3 ${examKey} Variant A] has 5 sections`, aSecs.length === 5 && aSecs.includes("listening") && aSecs.includes("reading"));
        const bSecs = Object.keys(testB.sections);
        assert(`[GG3 ${examKey} Variant B] has 5 sections`, bSecs.length === 5 && bSecs.includes("listening") && bSecs.includes("reading"));

        // Perfect score Variant A
        const perfectA = {};
        for (const sec of Object.values(testA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }
          }
        }
        const evalA = Validator.evaluateTest("variantA", perfectA, examKey, "gogetter3");
        assert(`[GG3 ${examKey} Variant A] Total Score is 50/50`, evalA.totalScore === 50, `Got: ${evalA.totalScore}`);
        assert(`[GG3 ${examKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[GG3 ${examKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Perfect score Variant B
        const perfectB = {};
        for (const sec of Object.values(testB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectB[qId] = ansObj.expected[0];
            }
          }
        }

      }

      // 2e. Go Getter 2 Tests across all 8 Units (16 Variants, 30 points each)
      const gg2Units = TEST_DATA.getUnitsList("gogetter2");
      assert("Go Getter 2 list contains 10 units (8 units + 2 exams)", gg2Units.length === 10);
      for (let u = 1; u <= 8; u++) {
        const uKey = "unit" + u;
        const expectedPts = 30;
        const testA = TEST_DATA.getTest(uKey, "variantA", "gogetter2");
        const testB = TEST_DATA.getTest(uKey, "variantB", "gogetter2");
        assert(`[GG2 ${uKey}] Variant A defined`, !!testA);
        assert(`[GG2 ${uKey}] Variant B defined`, !!testB);

        assert(`[GG2 ${uKey}] Variant B total points is ${expectedPts}`, testB.totalPoints === expectedPts);

        // Perfect score Variant A
        const perfectA = {};
        for (const sec of Object.values(testA.sections)) {
          for (const task of sec.tasks) {

        assert(`[GG2 ${uKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Perfect score Variant B
        const perfectB = {};
        for (const sec of Object.values(testB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {

        }
        const evalB = Validator.evaluateTest("variantB", perfectB, uKey, "gogetter2");

        assert(`[GG2 ${uKey} Variant B] Percentage is 100%`, evalB.percentage === 100);
        assert(`[GG2 ${uKey} Variant B] Zero mistakes`, evalB.mistakes.length === 0, `Mistakes: ${evalB.mistakes.map(m=>m.id).join(',')}`);
      }

      // 2f. Go Getter 2 Mid-Year and End-of-Year Exams (50 points each, 5 sections, audio tracks attached)
      for (const examKey of ["mid_year", "end_of_year"]) {
        const testA = TEST_DATA.getTest(examKey, "variantA", "gogetter2");
        const testB = TEST_DATA.getTest(examKey, "variantB", "gogetter2");
        assert(`[GG2 ${examKey}] Variant A defined`, !!testA);
        assert(`[GG2 ${examKey}] Variant B defined`, !!testB);
        assert(`[GG2 ${examKey}] Variant A total points is 50`, testA.totalPoints === 50);
        assert(`[GG2 ${examKey}] Variant B total points is 50`, testB.totalPoints === 50);
        assert(`[GG2 ${examKey}] Has audioTrack`, !!testA.audioTrack);

        // Check 5 sections exist
        const aSecs = Object.keys(testA.sections);
        assert(`[GG2 ${examKey} Variant A] has 5 sections`, aSecs.length === 5 && aSecs.includes("listening") && aSecs.includes("reading"));
        const bSecs = Object.keys(testB.sections);
        assert(`[GG2 ${examKey} Variant B] has 5 sections`, bSecs.length === 5 && bSecs.includes("listening") && bSecs.includes("reading"));

        // Perfect score Variant A
        const perfectA = {};
        for (const sec of Object.values(testA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }
          }
        }
        const evalA = Validator.evaluateTest("variantA", perfectA, examKey, "gogetter2");
        assert(`[GG2 ${examKey} Variant A] Total Score is 50/50`, evalA.totalScore === 50, `Got: ${evalA.totalScore}`);
        assert(`[GG2 ${examKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[GG2 ${examKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Perfect score Variant B
        const perfectB = {};
        for (const sec of Object.values(testB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {

            }
          }
        }

        assert(`[GG2 ${examKey} Variant B] Total Score is 50/50`, evalB.totalScore === 50, `Got: ${evalB.totalScore}`);
        assert(`[GG2 ${examKey} Variant B] Percentage is 100%`, evalB.percentage === 100);
        assert(`[GG2 ${examKey} Variant B] Zero mistakes`, evalB.mistakes.length === 0, `Mistakes: ${evalB.mistakes.map(m=>m.id).join(',')}`);
      }

      // 2g. Go Getter 1 Units 1 to 8 (30 points each, Variant A & Variant B)
      const gg1Units = ["unit1", "unit2", "unit3", "unit4", "unit5", "unit6", "unit7", "unit8"];
      for (const uKey of gg1Units) {
        const testA = TEST_DATA.getTest(uKey, "variantA", "gogetter1");
        const testB = TEST_DATA.getTest(uKey, "variantB", "gogetter1");
        assert(`[GG1 ${uKey}] Variant A defined`, !!testA);
        assert(`[GG1 ${uKey}] Variant B defined`, !!testB);
        assert(`[GG1 ${uKey}] Variant A total points is 30`, testA.totalPoints === 30);
        assert(`[GG1 ${uKey}] Variant B total points is 30`, testB.totalPoints === 30);

        // Perfect score Variant A
        const perfectA = {};
        for (const sec of Object.values(testA.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {
              perfectA[qId] = ansObj.expected[0];
            }
          }
        }
        const evalA = Validator.evaluateTest("variantA", perfectA, uKey, "gogetter1");
        assert(`[GG1 ${uKey} Variant A] Total Score is 30/30`, evalA.totalScore === 30, `Got: ${evalA.totalScore}`);
        assert(`[GG1 ${uKey} Variant A] Percentage is 100%`, evalA.percentage === 100);
        assert(`[GG1 ${uKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);

        // Perfect score Variant B
        const perfectB = {};
        for (const sec of Object.values(testB.sections)) {
          for (const task of sec.tasks) {
            for (const [qId, ansObj] of Object.entries(task.answers)) {

      // 2h. Go Getter 1 Mid-Year and End-of-Year Exams (50 points each, audio tracks attached)
      for (const examKey of ["mid_year", "end_of_year"]) {
        const testA = TEST_DATA.getTest(examKey, "variantA", "gogetter1");
        assert(`[GG1 ${examKey}] Variant A defined`, !!testA);
        assert(`[GG1 ${examKey}] Variant A total points is 50`, testA.totalPoints === 50);
        assert(`[GG1 ${examKey}] Has audioTrack`, !!testA.audioTrack);

        assert(`[GG1 ${examKey} Variant A] Zero mistakes`, evalA.mistakes.length === 0, `Mistakes: ${evalA.mistakes.map(m=>m.id).join(',')}`);
      }

      // 2i. Go Getter 1 and Courses List
      const allCourses = TEST_DATA.getCoursesList();
      assert("Courses list contains 4 courses (GG1, GG2, GG3, GG4)", allCourses.length === 4);
      assert("Go Getter 1 is available with 10 units (8 units + 2 exams)", TEST_DATA.getUnitsList("gogetter1").length === 10);
      assert("All 4 courses have cover images", allCourses.every(c => typeof c.coverImage === "string" && c.coverImage.length > 0));

      // 3. Normalization & Contraction Equivalence Tests
      assert("Normalizes lowercase", Validator.normalize("  SHIRT  ") === "shirt");
      assert("Normalizes smart apostrophe", Validator.normalize("didn’t") === "didn't");
      assert("Removes trailing dot", Validator.normalize("baggy.") === "baggy");
      assert("Handles didn't as did not", Validator.checkAnswer("didn't", ["did not"]));
      assert("Handles did not as didn't", Validator.checkAnswer("did not", ["didn't"]));
      assert("Handles haven't as have not", Validator.checkAnswer("haven't", ["have not"]));
      assert("Handles won't as will not", Validator.checkAnswer("won't", ["will not"]));
      assert("Handles isn't as is not", Validator.checkAnswer("isn't", ["is not"]));
      assert("Handles 'll as will", Validator.checkAnswer("we'll put", ["we will put"]));

      // 4. Illustrations for Unit 1
      assert("Mrs Cook illustration generated", Illustrations.renderIllustration("mrs_cook").includes("<img"));
      assert("Mrs Smith illustration generated", Illustrations.renderIllustration("mrs_smith").includes("<img"));
      assert("Gregory Cook illustration generated", Illustrations.renderIllustration("gregory_cook").includes("<img"));
      assert("Lee illustration generated", Illustrations.renderIllustration("lee").includes("<img"));

    } catch (e) {
      assert("Unhandled Exception in Test Suite", false, e.toString() + "\n" + e.stack);
    }

    const passCount = results.filter(r => r.pass).length;
    const failCount = results.filter(r => !r.pass).length;
    const summary = `RESULTS: ${passCount} PASSED, ${failCount} FAILED`;
    console.log(summary);

    const summaryEl = document.getElementById("summary");
    summaryEl.className = failCount === 0 ? "pass-sum" : "fail-sum";
    summaryEl.innerText = summary;

    document.getElementById("test-results").innerHTML = results.map(r => `
      <li class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓' : '✗'} ${r.name} ${r.details || ''}</li>
    `).join("");
  </script>
</body>
</html>
